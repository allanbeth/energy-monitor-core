<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_title }}</title>
  <base href="{{ base_href }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/css/app.css" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body data-page="{{ page_name | default('dashboard') }}">
  <div class="app-shell">
    <header class="app-header">
      <div>
        <div class="eyebrow">Energy Monitor Core</div>
        <h1>{{ app_title }}</h1>
      </div>
      <div class="d-flex flex-wrap gap-2 align-items-center header-nav">
        <a class="nav-chip nav-chip-primary" href="/">Dashboard</a>
        <a class="nav-chip nav-chip-secondary" href="/settings">Settings</a>
        {% for module in module_nav or [] %}
        <a class="nav-chip nav-chip-module" href="{{ module.module_url }}">{{ module.title }}</a>
        {% endfor %}
        {% block header_actions %}{% endblock %}
      </div>
    </header>
    <main class="app-main container-fluid py-4">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
    window.EM_BASE_HREF = {{ base_href|tojson }};
  </script>
  <script src="static/js/app.js"></script>
</body>
</html>
