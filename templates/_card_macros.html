{% macro card_header(icon, title, subtitle='', eyebrow='', subtitle_html=false) -%}
<div class="card-header-default app-card-header">
  <div class="card-header-main app-card-header-main">
    <div class="card-header-icon app-card-header-icon">
      <i class="fa-solid {{ icon }}"></i>
    </div>
    <div class="card-header-meta app-card-header-meta">
      {% if eyebrow %}
      <div class="eyebrow">{{ eyebrow }}</div>
      {% endif %}
      <h3 class="card-header-title app-card-title">{{ title }}</h3>
      {% if subtitle %}
      {% if subtitle_html %}
      <p class="card-header-subtitle app-card-subtitle">{{ subtitle|safe }}</p>
      {% else %}
      <p class="card-header-subtitle app-card-subtitle">{{ subtitle }}</p>
      {% endif %}
      {% endif %}
    </div>
  </div>
  <div class="card-header-actions app-card-header-actions">
    {{ caller() }}
  </div>
</div>
{%- endmacro %}
